[backdrop]
blur_intensity = 0.0
tint_intensity = 0.99999997764825821

[bar.default]
border = "surface_variant"
border_width = 0.5
capsule = true
capsule_radius = 6
center = ["workspaces", "media", "notifications"]
contact_shadow = true
end = [
  "tray",
  "bar",
  "widget",
  "power_profile",
  "network",
  "volume",
  "brightness",
  "battery",
  "clock",
  "control-center",
]
font_family = "Adwaita Sans"
margin_ends = 0
padding = 8
panel_overlap = 0
radius = 0
shadow = false
start = ["launcher", "active_window"]
thickness = 33

[battery]
warning_threshold = 40

[control_center.calendar]
show_events_card = false

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "dark_mode"

[[control_center.shortcuts]]
type = "clipboard"

[[control_center.shortcuts]]
type = "nightlight"

[desktop_widgets]
schema_version = 2
widget_order = ["desktop-widget-0000000000000001"]

[desktop_widgets.grid]
cell_size = 8
major_interval = 4
visible = true

[desktop_widgets.widget.desktop-widget-0000000000000001]
box_height = 168.0
box_width = 200.0
cx = 1259.0
cy = 124.0
output = "eDP-1"
placement_height = 768.0
placement_width = 1366.0
rotation = 0.0
type = "weather"

[desktop_widgets.widget.desktop-widget-0000000000000001.settings]
background_padding = 20
show_forecast = true

[dock]
auto_hide = true
reserve_space = false

[idle]
behavior_order = ["lock", "screen-off", "lock-and-suspend"]
pre_action_fade_seconds = 10

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 300.0

[idle.behavior.lock-and-suspend]
action = "lock_and_suspend"
enabled = true
timeout = 350.0

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 300.0

[location]
auto_locate = true

[lockscreen]
blurred_desktop = true

[lockscreen_widgets]
