[nightlight]
enabled = false

[plugin_settings."noctalia/mpvpaper"]
video_directory = "/home/zeaman/Videos"

[plugin_settings."noctalia/screen_recorder"]
copy_to_clipboard = true

[plugin_settings."noctalia/umbriel-companion"]
panel_open_near_click = false

[plugins]
enabled = [
  "oldirtty/color_picker",
  "cleboost/zed-provider",
  "yocraft/web-launcher",
  "noctalia/umbriel-companion",
]

[shell]
avatar_path = "/home/zeaman/Pictures/favicon.jpg"
font_family = "Adwaita Sans"
niri_overview_type_to_launch_enabled = true
password_style = "random"
polkit_agent = true
screen_time_enabled = true

[shell.panel]
clipboard_placement = "attached"
launcher_placement = "attached"

[theme]
builtin = "Noctalia"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"

[theme.templates]
builtin_ids = [
  "alacritty",
  "btop",
  "gtk3",
  "gtk4",
  "ghostty",
  "hyprland",
  "kcolorscheme",
  "kitty",
  "niri",
  "qt",
  "starship",
  "umbriel",
]
community_ids = ["libreoffice", "fastfetch", "hyprtoolkit"]

[wallpaper]
directory = "/home/zeaman/Pictures/Wallpapers"

[wallpaper.default]
path = "/home/zeaman/Pictures/Wallpapers/fairy-tale-dark.webp"

[wallpaper.last]
path = "/home/zeaman/Pictures/Wallpapers/fairy-tale-dark.webp"

[wallpaper.monitors.eDP-1]
path = "/home/zeaman/Pictures/Wallpapers/fairy-tale-dark.webp"

[widget.active_window]
anchor = true

[widget.bar]
type = "noctalia/umbriel-companion:bar"

[widget.battery]
display_mode = "graphic"
show_label = false

[widget.brightness]
scale = 1.1500000000000001
show_label = false

[widget.clock]
format = "{:%I:%M %p}"
timezone = "Africa/Addis_Ababa"

[widget.launcher]
anchor = true
capsule = true
capsule_padding = 4
capsule_radius = 5
custom_image = "/home/zeaman/Pictures/Fedora.svg"
glyph = ""
scale = 1.2

[widget.media]
album_art_only = true
hide_when_no_media = true
max_length = 170
title_scroll = "on_hover"

[widget.network]
scale = 1.25
show_label = false

[widget.tray]
hide_passive = false

[widget.volume]
scale = 1.05
show_label = false

[widget.widget]
type = "oldirtty/color_picker:widget"
