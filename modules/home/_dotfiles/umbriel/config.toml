[include]
files = []

[output.DP-1]
workspaces = 5

[general]
autostart = [
  "noctalia",
  "wl-paste --type text --watch cliphist store",
  "wl-paste --type image --watch cliphist store",
  "sleep 2 && qs -c angular-frame",
]
xwayland = true # requires restart to change
show_cheatsheet = false # show keybinds overlay on startup
focus_on_activate = false # unsolicited requests cannot add focus; trusted launches may still focus
honor_restored_maximize = true # let apps restore their saved maximized state

[workspaces]
back_and_forth = false
empty_above = false

# Animation ------------------------------------------------------------------

[animation]
enabled = true
duration_ms = 200 # 1-10000
curve = "easeout"

[animation.windows_in]
enabled = true
duration_ms = 150
curve = "easeout"
style = "popin" # popin, zoom, slide, fade, none
scale = 0.85 # 0.1-1.0, used by popin

[animation.windows_out]
enabled = true
duration_ms = 150
curve = "easeout"
style = "fade" # fade, slide

[animation.windows_move]
enabled = true # window move, resize, and floating maximize transitions
duration_ms = 250
curve = "snappy"

[animation.workspaces]
enabled = true
duration_ms = 250
curve = "easeout"

[animation.overview]
enabled = true
duration_ms = 250
curve = "easeout"

[animation.scratchpad]
enabled = false
duration_ms = 250
curve = "easeout"
dim = 0.5 # 0.0-1.0
blur = false
scale = 0.0 # 0 preserves the window geometry
maximize = false
fullscreen = false

[animation.border]
enabled = false
duration_ms = 250
curve = "easeout"

[animation.dim_unfocused]
enabled = false
duration_ms = 250
curve = "easeout"
dim = 0.0 # 0.0-1.0

[animation.layers]
enabled = false
duration_ms = 250
curve = "easeout"

# Appearance -----------------------------------------------------------------

[appearance]
prefer_no_csd = false # false lets newly started apps draw their own decorations
border_width = 0 # 0-100
outer_border_width = 0 # 0-100
corner_radius = 9 # 0-100, radius of the final decorated outer edge
drag_opacity = 0.75

[appearance.blur]
enabled = true
optimized = true
passes = 3 # 0-8
radius = 3 # 0-100
noise = 0.02 # 0.0-1.0
brightness = 0.9 # 0.0-2.0
contrast = 0.9 # 0.0-2.0
saturation = 1.1 # 0.0-2.0

[appearance.shadow]
enabled = true
softness = 10 # 0-200, 0 = hard edge
offset_x = 2 # -200 to 200
offset_y = 2

# Overview -------------------------------------------------------------------

[overview]
zoom = 0.5

# Hot corners ---------------------------------------------------------------

[hot_corners.top_left]
enabled = true
delay_ms = 500 # 0-10000, 0 activates immediately
action = "overview-open"

[hot_corners.top_right]
enabled = false
delay_ms = 500
action = "overview-close"

[hot_corners.bottom_left]
enabled = false
delay_ms = 500
action = "overview-toggle"

[hot_corners.bottom_right]
enabled = false
delay_ms = 500
action = "spawn:notify-send 'Bottom right'"

# Layout ---------------------------------------------------------------------

[layout]
mode = "scrolling" # "scrolling", "dwindle", or "master"
gap = 2 # 0-500
extent_presets = [0.5, 1.0]
# width_presets = [0.333, 0.5, 1.0] # width and height cycling, tiled and floating alike

[layout.struts]
left = 0 # -65535 to 65535
right = 0
top = 0
bottom = 0

[layout.scrolling]
# Vertical workspaces stack horizontal lanes from top to bottom.
# direction = "horizontal"
# A matching output may override this initial-only value for all its workspaces.
center_underfull_strip = true # center the strip whenever it is narrower than the viewport
center_focused = "on_overflow" # always center the focused column
# expand_single_column = true # fill lone column to viewport width
default_extent_fraction = 1.0

[layout.dwindle]
[layout.master]
position = "left" # "left" or "right"
default_width_fraction = 0.55 # 0.1-0.9
new_on_top = true # place new windows at the top of the stack

# Input ----------------------------------------------------------------------

[input]
middle_click_paste = true # primary-selection clipboard, applies on reload

[input.keyboard]
layout = "" # "us,de" loads both; switch with keyboard-layout-next
variant = ""
options = "" # XKB options, e.g. "grp:alt_shift_toggle"
repeat_rate = 25 # 0-1000 Hz
repeat_delay = 600 # 0-10000 ms
numlock_toggle = true # true enables NumLock when a keyboard connects; false leaves it off
track_layout = "global" # "global", or "window" to track the layout per surface

[input.touchpad]
tap = true

[input.mouse] # omitted preserves the device's libinput default
sensitivity = 0.0 # pointer speed, -1.0 to 1.0
scroll_wheel_step = 60 # 1-1000

[input.tablet]
enabled = false # false disables the tablet and its pads

[input.cursor]
theme = "macOS"
size = 30 # 1-512
hardware_cursor = true # false forces software cursor composition
follows_focus = true # warp to windows selected by focus navigation
hide_when_typing = false # hide after typing unless a pointer button is held
hide_timeout_ms = 0 # 0-3600000, 0 disables hiding

[input.focus]
follows_mouse = true

# Keybinds (see docs/user/keybinds.md) --------------------------------------
[keybinds]
"Mod+Q" = "spawn:ghostty"
"Mod+V" = "window-toggle-floating"
"Mod+T" = "spawn:gnome-text-editor"
"Mod+E" = "window-toggle-maximize-to-edges"
"Mod+M" = "spawn:resources"
"Mod+P" = "spawn:qs -c angular-frame"
"Mod+Ctrl+P" = "spawn:qs -c angular-frame kill"
"Mod+X" = "window-close"
"Mod+Shift+Space" = "window-move-to-scratchpad"
"Mod+Space" = "scratchpad-toggle"
"Mod+Ctrl+Space" = "window-restore-from-scratchpad"
"Mod+Tab" = "scratchpad-focus-next"
"Mod" = "spawn:noctalia msg panel-toggle launcher"
"Mod+O" = "overview-toggle"
"Mod+Alt+L" = "spawn:loginctl lock-session"

"Mod+1" = "workspace-switch:1"
"Mod+2" = "workspace-switch:2"
"Mod+3" = "workspace-switch:3"
"Mod+4" = "workspace-switch:4"
"Mod+5" = "workspace-switch:5"
"Mod+6" = "workspace-switch:6"

"Mod+Shift+1" = "column-move-to-workspace:1"
"Mod+Shift+2" = "column-move-to-workspace:2"
"Mod+Shift+3" = "column-move-to-workspace:3"
"Mod+Shift+4" = "column-move-to-workspace:4"
"Mod+Shift+5" = "column-move-to-workspace:5"
"Mod+Shift+6" = "column-move-to-workspace:6"

# --- Applications & Tools ---
"Mod+R" = "window-cycle-primary-extent"
"Mod+F" = "spawn:nautilus"
"Mod+C" = "spawn:zeditor"
"Mod+Z" = "spawn:zeditor"
"Mod+B" = "spawn:helium-browser"
"Mod+K" = "spawn:codium"
"Alt+V" = "spawn:flatpak run xyz.riothedev.emojify"
"Mod+L" = "spawn:flatpak run org.libreoffice.LibreOffice"
"Mod+W" = "spawn:noctalia msg panel-toggle wallpaper"
"Mod+S" = "spawn:noctalia msg panel-toggle control-center"
"Mod+H" = "spawn:noctalia msg panel-toggle clipboard"

# --- Window Focus ---
"Mod+A" = "window-focus-left"
"Mod+D" = "window-focus-right"
"Mod+Left" = "window-focus-left"
"Mod+Right" = "window-focus-right"

"Mod+Ctrl+Right" = "window-move-or-output-right"
"Mod+Ctrl+Left" = "window-move-or-output-left"

"Mod+U" = "session-quit"
"Print" = "spawn:grim -g \"$(slurp)\" - | swappy -f -"
"Ctrl+Print" = "spawn:grim ~/Pictures/Screenshots/shot-$(date +%Y%m%d-%H%M%S).jpg"

# --- Media & Volume (Allow when locked) ---
"XF86AudioRaiseVolume" = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%+"
"XF86AudioLowerVolume" = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%-"
"Mod+XF86AudioMute" = "spawn:wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"

"XF86AudioPlay" = "spawn:playerctl play-pause"
"XF86AudioNext" = "spawn:playerctl next"
"XF86AudioPrev" = "spawn:playerctl previous"

"XF86MonBrightnessUp" = "spawn:noctalia msg brightness-up 10"
"XF86MonBrightnessDown" = "spawn:noctalia msg brightness-down 10"

# Window rules (see docs/user/window-rules.md) ---------------------------
# Blur all windows
[[window_rule]]
blur = true
blur_optimized = false

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = false
default_floating_size_px = { width = 1020, height = 90 }

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

# Browsers do not expose a semantic PiP role or control global window position.
[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

# Emojify (Fixed floating size)
[[window_rule]]
match.app_id = "^xyz.riothedev.emojify$"
default_floating = true
default_floating_size_px = { width = 646, height = 474 }

# Emojify (Fixed floating size)
[[window_rule]]
match.app_id = "^com.github.neithern.g4music$"
default_floating = true
default_floating_size_px = { width = 550, height = 730 }

# Layer rules (see docs/user/layer-rules.md) ---------------------------

[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd)$"
blur = true
blur_ignore_alpha = 0.5
blur_optimized = false

[include.optional]
files = ["noctalia.toml"]
